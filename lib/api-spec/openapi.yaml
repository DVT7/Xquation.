openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: XQution - Physics and Astronomy Formula Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: formulas
    description: Formula operations
  - name: constants
    description: Physical and astronomical constants
  - name: problems
    description: Practice problems
  - name: glossary
    description: Glossary terms
  - name: favorites
    description: User favorites
  - name: search
    description: Global search
  - name: stats
    description: Site statistics
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: owner
    description: Owner dashboard and platform management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /formulas:
    get:
      operationId: listFormulas
      tags: [formulas]
      summary: List all formulas
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of formulas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Formula"

  /formulas/{id}:
    get:
      operationId: getFormula
      tags: [formulas]
      summary: Get a formula by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Formula
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Formula"
        "404":
          description: Not found

  /formulas/categories:
    get:
      operationId: listFormulaCategories
      tags: [formulas]
      summary: List all formula categories with counts
      responses:
        "200":
          description: Categories with counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryCount"

  /constants:
    get:
      operationId: listConstants
      tags: [constants]
      summary: List all physical constants
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of constants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Constant"

  /constants/{id}:
    get:
      operationId: getConstant
      tags: [constants]
      summary: Get a constant by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Constant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Constant"
        "404":
          description: Not found

  /problems:
    get:
      operationId: listProblems
      tags: [problems]
      summary: List practice problems
      parameters:
        - name: topic
          in: query
          required: false
          schema:
            type: string
        - name: difficulty
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of problems
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Problem"

  /problems/{id}:
    get:
      operationId: getProblem
      tags: [problems]
      summary: Get a problem by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not found

  /glossary:
    get:
      operationId: listGlossaryTerms
      tags: [glossary]
      summary: List glossary terms
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of glossary terms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GlossaryTerm"

  /glossary/{id}:
    get:
      operationId: getGlossaryTerm
      tags: [glossary]
      summary: Get a glossary term by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Glossary term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlossaryTerm"
        "404":
          description: Not found

  /favorites:
    get:
      operationId: listFavorites
      tags: [favorites]
      summary: List all favorites
      responses:
        "200":
          description: List of favorites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Favorite"
    post:
      operationId: addFavorite
      tags: [favorites]
      summary: Add a favorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteInput"
      responses:
        "201":
          description: Created favorite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favorite"

  /favorites/{id}:
    delete:
      operationId: removeFavorite
      tags: [favorites]
      summary: Remove a favorite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: Search across all content
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get platform statistics
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /formulas/{id}/view:
    post:
      tags: [formulas]
      operationId: recordFormulaView
      summary: Record that the authenticated user viewed a formula for 1+ minute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: View recorded
        '401':
          description: Not authenticated

  /user/stats:
    get:
      tags: [Auth]
      operationId: getUserStats
      summary: Get activity stats for the authenticated user
      responses:
        '200':
          description: User stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'
        '401':
          description: Not authenticated

  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /formulas/featured:
    get:
      operationId: listFeaturedFormulas
      tags: [formulas]
      summary: List featured/popular formulas
      responses:
        "200":
          description: Featured formulas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Formula"

  /owner/analytics:
    get:
      operationId: getOwnerAnalytics
      tags: [owner]
      summary: Get owner dashboard analytics
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerAnalytics"
        "403":
          description: Forbidden
        "401":
          description: Unauthorized

  /owner/users:
    get:
      operationId: listOwnerUsers
      tags: [owner]
      summary: List enriched users
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerUserList"
        "403":
          description: Forbidden

  /owner/users/{id}/role:
    patch:
      operationId: changeUserRole
      tags: [owner]
      summary: Change a user's role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [user, owner]
      responses:
        "200":
          description: Role updated
        "403":
          description: Forbidden

  /owner/users/{id}/ban:
    post:
      operationId: banUser
      tags: [owner]
      summary: Ban a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                durationMinutes:
                  type: integer
      responses:
        "200":
          description: User banned
        "403":
          description: Forbidden

  /owner/users/{id}/unban:
    post:
      operationId: unbanUser
      tags: [owner]
      summary: Unban a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User unbanned
        "403":
          description: Forbidden

  /owner/announcements:
    get:
      operationId: listAnnouncements
      tags: [owner]
      summary: List all announcements
      responses:
        "200":
          description: Announcement list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerAnnouncementList"
    post:
      operationId: createAnnouncement
      tags: [owner]
      summary: Create an announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, message]
              properties:
                title:
                  type: string
                message:
                  type: string
                type:
                  type: string
                scope:
                  type: string
                icon:
                  type: string
                priority:
                  type: string
                  enum: [low, normal, high, urgent]
                isPinned:
                  type: boolean
                expiresAt:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Created
        "403":
          description: Forbidden

  /owner/announcements/{id}:
    delete:
      operationId: deleteAnnouncement
      tags: [owner]
      summary: Delete an announcement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden

  /owner/feedback:
    get:
      operationId: listOwnerFeedback
      tags: [owner]
      summary: List all feedback
      responses:
        "200":
          description: Feedback list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerFeedbackList"
        "403":
          description: Forbidden

  /owner/feedback/{id}/reply:
    post:
      operationId: replyToFeedback
      tags: [owner]
      summary: Reply to feedback
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reply]
              properties:
                reply:
                  type: string
      responses:
        "200":
          description: Reply sent
        "403":
          description: Forbidden

  /owner/admin-actions:
    get:
      operationId: listAdminActions
      tags: [owner]
      summary: List admin action log
      responses:
        "200":
          description: Admin actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionList"
        "403":
          description: Forbidden

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        role:
          type: string
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
        ban:
          oneOf:
            - $ref: '#/components/schemas/BanInfo'
            - type: 'null'
    BanInfo:
      type: object
      required: [reason, isPermanent, expiresAt]
      properties:
        reason:
          type: string
        isPermanent:
          type: boolean
        expiresAt:
          type: ["string", "null"]
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    UserStats:
      type: object
      required: [favoritesCount, formulasViewed]
      properties:
        favoritesCount:
          type: integer
        formulasViewed:
          type: integer
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Formula:
      type: object
      required: [id, name, category, latex, description]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        subcategory:
          type: ["string", "null"]
        latex:
          type: string
        description:
          type: string
        variables:
          type: string
        siUnits:
          type: ["string", "null"]
        example:
          type: ["string", "null"]
        relatedFormulas:
          type: ["string", "null"]
        isFeatured:
          type: boolean

    Constant:
      type: object
      required: [id, name, symbol, value, units, description]
      properties:
        id:
          type: integer
        name:
          type: string
        symbol:
          type: string
        value:
          type: string
        units:
          type: string
        description:
          type: string
        category:
          type: ["string", "null"]

    Problem:
      type: object
      required: [id, topic, question, difficulty]
      properties:
        id:
          type: integer
        topic:
          type: string
        question:
          type: string
        difficulty:
          type: string
        hint:
          type: ["string", "null"]
        solution:
          type: ["string", "null"]
        answer:
          type: ["string", "null"]

    GlossaryTerm:
      type: object
      required: [id, term, definition]
      properties:
        id:
          type: integer
        term:
          type: string
        definition:
          type: string
        category:
          type: ["string", "null"]

    Favorite:
      type: object
      required: [id, itemType, itemId, itemName]
      properties:
        id:
          type: integer
        itemType:
          type: string
        itemId:
          type: integer
        itemName:
          type: string
        createdAt:
          type: string

    FavoriteInput:
      type: object
      required: [itemType, itemId, itemName]
      properties:
        itemType:
          type: string
        itemId:
          type: integer
        itemName:
          type: string

    CategoryCount:
      type: object
      required: [category, count]
      properties:
        category:
          type: string
        count:
          type: integer

    SearchResults:
      type: object
      required: [formulas, constants, problems, glossary]
      properties:
        formulas:
          type: array
          items:
            $ref: "#/components/schemas/Formula"
        constants:
          type: array
          items:
            $ref: "#/components/schemas/Constant"
        problems:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
        glossary:
          type: array
          items:
            $ref: "#/components/schemas/GlossaryTerm"

    PlatformStats:
      type: object
      required: [formulaCount, constantCount, problemCount, glossaryCount, categoryCount]
      properties:
        formulaCount:
          type: integer
        constantCount:
          type: integer
        problemCount:
          type: integer
        glossaryCount:
          type: integer
        categoryCount:
          type: integer

    OwnerAnalytics:
      type: object
      required: [totalUsers, newUsersToday, totalViews, totalFavorites, totalSearches, activeSessionsToday, onlineUsers, topViewed, topFavorited, topSearches, feedback]
      properties:
        totalUsers:
          type: integer
        newUsersToday:
          type: integer
        totalViews:
          type: integer
        totalFavorites:
          type: integer
        totalSearches:
          type: integer
        activeSessionsToday:
          type: integer
        onlineUsers:
          type: integer
        topViewed:
          type: array
          items:
            type: object
            required: [formulaId, views]
            properties:
              formulaId:
                type: integer
              views:
                type: integer
        topFavorited:
          type: array
          items:
            type: object
            required: [itemId, favorites]
            properties:
              itemId:
                type: integer
              favorites:
                type: integer
        topSearches:
          type: array
          items:
            type: object
            required: [query, count]
            properties:
              query:
                type: string
              count:
                type: integer
        feedback:
          type: object
          required: [total, open, replied]
          properties:
            total:
              type: integer
            open:
              type: integer
            replied:
              type: integer

    OwnerUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/OwnerEnrichedUser"

    OwnerEnrichedUser:
      type: object
      required: [id, role, createdAt, favoritesCount, formulasViewed, isBanned, isOnline]
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        role:
          type: string
        createdAt:
          type: string
          format: date-time
        favoritesCount:
          type: integer
        formulasViewed:
          type: integer
        isBanned:
          type: boolean
        banReason:
          type: ["string", "null"]
        banExpiresAt:
          type: ["string", "null"]
        isOnline:
          type: boolean
        lastActive:
          type: ["string", "null"]

    OwnerAnnouncementList:
      type: object
      required: [announcements]
      properties:
        announcements:
          type: array
          items:
            $ref: "#/components/schemas/OwnerAnnouncement"

    OwnerAnnouncement:
      type: object
      required: [id, type, scope, title, message, priority, isPinned, isDraft, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        scope:
          type: string
        title:
          type: string
        message:
          type: string
        icon:
          type: ["string", "null"]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        isPinned:
          type: boolean
        isDraft:
          type: boolean
        expiresAt:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    OwnerFeedbackList:
      type: object
      required: [feedback]
      properties:
        feedback:
          type: array
          items:
            $ref: "#/components/schemas/OwnerFeedback"

    OwnerFeedback:
      type: object
      required: [id, type, message, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        message:
          type: string
        userId:
          type: ["string", "null"]
        userName:
          type: ["string", "null"]
        ownerReply:
          type: ["string", "null"]
        ownerRepliedAt:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    AdminActionList:
      type: object
      required: [actions]
      properties:
        actions:
          type: array
          items:
            $ref: "#/components/schemas/AdminAction"

    AdminAction:
      type: object
      required: [id, actorId, action, targetType, targetId, createdAt]
      properties:
        id:
          type: integer
        actorId:
