kind = "web"
previewPath = "/"
title = "XQution"
version = "1.0.0"
id = "artifacts/xqution"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19041

[services.development]
run = "pnpm --filter @workspace/xqution run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/xqution", "run", "build" ]
publicDir = "artifacts/xqution/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19041"
BASE_PATH = "/"
